<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>SCHMEETTERLING</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<h1>SCHMEETTERLING</h1>

<p>Internal Information System</p>

<hr>

<div id="startScreen">

    <p>STATUS : ONLINE</p>

    <p>CLEARANCE : GUEST</p>

    <p>TERMINAL READY</p>

    <hr>

    <button id="loginButton">
        PRESS ENTER TO LOGIN
    </button>

</div>

<div id="loginScreen" style="display:none;">

    <h2>LOGIN</h2>

    <input
        type="text"
        id="username"
        placeholder="이름">

    <br><br>

    <input
        type="password"
        id="password"
        placeholder="비밀번호">

    <br><br>

    <button id="enterButton">
        LOGIN
    </button>

</div>
<script src="script.js"></script>
</body>

</html>
