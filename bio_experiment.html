<body class="bioPage">

<div class="mainBox">


<h2>

</p>

🔍 현미경 시작
</button>

⏹ 관찰 종료

<script>


// ==========================
// USER
// ==========================


document.getElementById("userName").innerHTML =
localStorage.getItem("userName") || "UNKNOWN";


document.getElementById("userLevel").innerHTML =
localStorage.getItem("userLevel") || "NONE";




// ==========================
// MICROBE ENGINE
// ==========================


let canvas = document.getElementById("microscope");

let ctx = canvas.getContext("2d");


let microbes = [];

let microscopeTimer = null;

let scanTimer = null;

let scanY = 0;




function createMicrobe(){


microbes.push({

x:Math.random()*700,

y:Math.random()*400,

speed:0.5+Math.random()*2,

size:3+Math.random()*8

});


}



for(let i=0;i<15;i++){

createMicrobe();

}





// 미생물 그리기

function drawMicrobes(){


ctx.clearRect(0,0,700,400);



ctx.beginPath();

ctx.strokeStyle="#00ff66";

ctx.arc(
350,
200,
170,
0,
Math.PI*2
);

ctx.stroke();




for(let m of microbes){


ctx.beginPath();

ctx.fillStyle="#00ff66";


ctx.arc(
m.x,
m.y,
m.size,
0,
Math.PI*2
);


ctx.fill();



m.x += Math.cos(Date.now()/500+m.x)*m.speed;

m.y += Math.sin(Date.now()/700+m.y)*m.speed;



if(m.x<0)m.x=700;

if(m.x>700)m.x=0;

if(m.y<0)m.y=400;

if(m.y>400)m.y=0;


}



document.getElementById("count").innerHTML =
microbes.length;


}




// 스캔선

function scanEffect(){


ctx.beginPath();


ctx.strokeStyle="rgba(0,255,100,0.5)";


ctx.moveTo(
0,
scanY
);


ctx.lineTo(
700,
scanY
);


ctx.stroke();



scanY += 5;



if(scanY>400){

scanY=0;

}


}





// 현미경 시작

function startMicroscope(){


if(microscopeTimer){

return;

}



logText(
"> MICROSCOPE CONNECTED\n\n"+
"> CELL OBSERVATION START"
);



microscopeTimer=setInterval(

drawMicrobes,

30

);



scanTimer=setInterval(

scanEffect,

30

);



}




// 현미경 종료

function stopMicroscope(){


clearInterval(microscopeTimer);

clearInterval(scanTimer);


microscopeTimer=null;

scanTimer=null;


drawMicrobes();


logText(
"> OBSERVATION STOPPED"
);


}
  // ==========================
// LIFE DATABASE
// ==========================


let currentLife={};



let firstNames=[

"Umbra",
"Nox",
"Myco",
"Xeno",
"Proto",
"Void",
"Nano",
"Astra",
"Echo",
"Terra",
"Vita",
"Omega"

];



let lastNames=[

"spora",
"cell",
"bacteria",
"entity",
"organism",
"life"

];



let lifeTypes=[

"미확인 미생물",
"변칙 균류",
"액체 생명체",
"광물성 생명체",
"세포 군집",
"기생 생명체"

];



let lifeRisk=[

"SAFE",
"LOW",
"CAUTION",
"HIGH",
"EXTREME"

];




// ==========================
// CREATE LIFE
// ==========================


function createLife(){


let name =

firstNames[Math.floor(Math.random()*firstNames.length)]

+

"-"

+

lastNames[Math.floor(Math.random()*lastNames.length)];



currentLife={


name:name,


code:"BIO-"+Math.floor(100+Math.random()*900),


type:

lifeTypes[Math.floor(Math.random()*lifeTypes.length)],


risk:

lifeRisk[Math.floor(Math.random()*lifeRisk.length)],


rate:

Math.floor(40+Math.random()*60)


};



document.getElementById("lifeName").innerHTML=currentLife.name;

document.getElementById("lifeCode").innerHTML=currentLife.code;

document.getElementById("lifeType").innerHTML=currentLife.type;

document.getElementById("lifeRisk").innerHTML=currentLife.risk;

document.getElementById("lifeRate").innerHTML=currentLife.rate+"%";


document.getElementById("specimen").innerHTML=currentLife.name;



logText(
"> NEW SPECIMEN CREATED\n\n"+
currentLife.name
);


}





// ==========================
// SAVE
// ==========================


function saveLife(){


if(!currentLife.name){

alert("생명체를 먼저 생성하세요.");

return;

}



let data=

JSON.parse(localStorage.getItem("BIO_DATA"))

|| [];



data.push(currentLife);



localStorage.setItem(

"BIO_DATA",

JSON.stringify(data)

);



loadDatabase();


logText(
"> DATABASE SAVED"
);


}





function loadDatabase(){


let data=

JSON.parse(localStorage.getItem("BIO_DATA"))

|| [];



let box=document.getElementById("savedList");



if(data.length===0){

box.innerHTML="저장된 연구 데이터 없음";

return;

}



let text="";



data.forEach(x=>{


text+=

`

<br>
<b>${x.code}</b>
<br>
${x.name}
<br>
${x.type}
<br>
위험도 : ${x.risk}

<hr>

`;


});


box.innerHTML=text;


}





// ==========================
// DNA
// ==========================


function dnaAnalyze(){


if(!currentLife.name){

alert("표본 없음");

return;

}



let value=Math.floor(Math.random()*100);



document.getElementById("dna").innerHTML=

value+"%";



document.getElementById("cellActivity").innerHTML=

"ACTIVE";



logText(

"🧬 DNA ANALYSIS COMPLETE\n\n"+

"STABILITY : "+value+"%"

);


}






// ==========================
// CULTURE
// ==========================


function startCulture(){


if(!currentLife.name){

alert("표본 없음");

return;

}



let progress=0;


let bar=document.getElementById("cultureProgress");



let timer=setInterval(()=>{


progress+=2;


bar.style.width=progress+"%";


document.getElementById("cultureState").innerHTML=

progress+"%";



if(progress>=100){


clearInterval(timer);


document.getElementById("cultureState").innerHTML=

"✔ 배양 완료";


logText(
"CULTURE COMPLETE"
);


}



},80);


}





// ==========================
// MUTATION
// ==========================


function mutationEvent(){


let chance=Math.floor(Math.random()*100);



document.getElementById("mutation").innerHTML=

chance+"%";



logText(

"☣ MUTATION CHECK\n\n"+

chance+"%"

);


}





// ==========================
// CATALOG
// ==========================


function registerCatalog(){


if(!currentLife.name){

alert("등록할 개체 없음");

return;

}



let catalog=

JSON.parse(localStorage.getItem("BIO_CATALOG"))

|| [];



catalog.push(currentLife);



localStorage.setItem(

"BIO_CATALOG",

JSON.stringify(catalog)

);



logText(
"📖 CATALOG REGISTERED"
);


}





// ==========================
// LOG
// ==========================


function logText(text){


let box=document.getElementById("log");


box.innerHTML="";


let i=0;


let timer=setInterval(()=>{


box.innerHTML+=text[i];


i++;


if(i>=text.length){

clearInterval(timer);

}


},30);


}




// ==========================
// RANDOM EVENT
// ==========================


setInterval(()=>{


let r=Math.random();



if(r<0.03){

logText(
"⚠ UNKNOWN BIO SIGNAL"
);

}


},7000);




// START

loadDatabase();



</script>
