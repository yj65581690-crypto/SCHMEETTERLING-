<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>SCHMEETTERLING ACCESS</title>

<link rel="stylesheet" href="./style.css">

</head>


<body class="loadingPage">


<div class="loadingBox">


<h1 id="loadingText"></h1>


<p id="subText">
ACCESSING DATABASE...
</p>


<p class="online">
● CONNECTING
</p>


<p>
PLEASE WAIT
</p>


</div>




<script>


let text = "ACCESS GRANTED";

let index = 0;

let speed = 120;


let loadingText =
document.getElementById("loadingText");



function typing(){


if(index < text.length){


loadingText.innerHTML += text[index];


index++;


setTimeout(typing,speed);


}


else{


setTimeout(function(){


location.href="./main.html";


},1500);


}


}



typing();



</script>


</body>

</html>
