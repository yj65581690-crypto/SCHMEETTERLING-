<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>RADIOACTIVE RESEARCHER DATABASE</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>


<div class="mainBox">


<h2>
☢ RADIOACTIVE RESEARCHER DATABASE
</h2>


<hr>


<p>
SCHMEETTERLING 방사능 부서 연구원 정보
</p>


<hr>



<h3>
STAFF SEARCH
</h3>



<input
type="text"
id="searchInput"
placeholder="이름 / 직급 / 소속 검색"
onkeyup="searchStaff()"
>



<hr>



<h3>
STAFF LIST
</h3>




<div id="staffContainer">



<div class="recordBox staffCard">


<h2>
셀레스트
</h2>


<p>
<b>사번</b> : UE-G034
</p>


<p>
<b>직급</b> : 책임자
</p>


<p>
<b>소속</b> : 방사능 부서
</p>


<button onclick="location.href='./celeste.html'">
프로필 열람
</button>


</div>





<div class="recordBox staffCard">


<h2>
아우구스타스
</h2>


<p>
<b>사번</b> : UE-G586
</p>


<p>

</div>



</div>



<hr>



<button onclick="location.href='./radiation.html'">

← 방사능 부서

</button>



</div>




<script>


function searchStaff(){


let input =
document.getElementById("searchInput").value.toLowerCase();


let cards =
document.getElementsByClassName("staffCard");



for(let i = 0; i < cards.length; i++){


let text =
cards[i].innerText.toLowerCase();



if(text.includes(input)){

cards[i].style.display="block";

}

else{

cards[i].style.display="none";

}


}


}


</script>



</body>

</html>
