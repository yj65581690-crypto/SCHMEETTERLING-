.department{

.loading{


display:none;


position:absolute;


inset:0;


background:rgba(0,0,0,.8);


color:white;


z-index:20;



justify-content:center;


align-items:center;


flex-direction:column;

.progressBox{


width:320px;


height:25px;


border:2px solid white;



margin-top:20px;



}




.progress{


height:100%;


width:0%;


background:#ff69b4;



}






.error{


display:none;


position:absolute;


inset:0;



background:#000;


color:#ff69b4;


z-index:30;



justify-content:center;


align-items:center;


flex-direction:column;



font-size:40px;



}




.glitch{


animation:glitch .15s infinite;



}



@keyframes glitch{


0%{

transform:translate(0);

}


25%{

transform:translate(3px,-2px);

}


50%{

transform:translate(-3px,2px);

}


75%{

transform:translate(2px,1px);

}


100%{

transform:translate(0);

}


}





.damaged{


filter:

contrast(1.2)

brightness(.8);



}




.warning{


color:#b0006d;


font-weight:bold;

function changePage(direction){



let next=currentPage+direction;



if(next<1 || next>8){

if(Math.random()<0.2){

});



}

else{

});



}









function showLoading(callback){



let loading=document.getElementById("loading");

let progress=document.getElementById("progress");



loading.style.display="flex";


progress.style.width="0%";



let width=0;



let timer=setInterval(function(){



width+=20;



progress.style.width=

width+"%";




if(width>=100){



clearInterval(timer);



setTimeout(function(){



loading.style.display="none";


callback();



},200);



}



},80);



}









function showError(callback){



let error=document.getElementById("error");



error.style.display="flex";



setTimeout(function(){



error.style.display="none";


callback();



},500);



}
