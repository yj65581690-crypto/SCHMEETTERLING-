<h3>
📋 ORDER HISTORY
</h3>


<div class="recordBox" id="orderLog">

주문 기록 없음

</div>




<button onclick="location.href='./main.html'">

← CENTRAL TERMINAL

</button>



</div>


<script>

let cart=[];
let total=0;



function addCart(name,price){

cart.push({
name:name,
price:price
});

total += price;

updateCart();

}




function updateCart(){

let box=document.getElementById("cart");

box.innerHTML="";


if(cart.length===0){

box.innerHTML="주문한 메뉴 없음";

}

else{


cart.forEach(function(item,index){


box.innerHTML +=

`
<p>
☕ ${item.name}
<br>
${item.price.toLocaleString()}원
</p>
`;

});


}



document.getElementById("total").innerHTML =
total.toLocaleString();


}





function order(){
  function showOrders(){


let box=document.getElementById("orderLog");


let history =

JSON.parse(
localStorage.getItem("noctisOrders")
)

||[];



if(history.length===0){

box.innerHTML="주문 기록 없음";

return;

}



box.innerHTML="";



history.reverse().forEach(function(order){


box.innerHTML +=

`

<div class="staffRecord">

<p>
👤 주문자 : ${order.user}
</p>


<p>
🕒 ${order.time}
</p>


<p>
☕ 주문 메뉴
<br>

${order.items.map(
item=>item.name
).join("<br>")}

</p>


<p>
💰 TOTAL :
${order.total.toLocaleString()}원
</p>


</div>

<hr>

`;



});


  }


if(cart.length===0){

alert("주문할 메뉴가 없습니다.");

return;

}



let user =
localStorage.getItem("userName")
||"UNKNOWN";



let data={

user:user,

time:new Date().toLocaleString(),

items:cart,

total:total

};



let history =

JSON.parse(
localStorage.getItem("noctisOrders")
)
||[];




history.push(data);



localStorage.setItem(
"noctisOrders",
JSON.stringify(history)
);



alert(

"☕ NOCTIS CAFE\n\n주문 완료\n\nTOTAL : "
+total.toLocaleString()
+"원"

);



cart=[];

total=0;


updateCart();
  showOrders();


}



</script>
