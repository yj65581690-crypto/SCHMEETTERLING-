<script>


let cart=[];

let total=0;



function addCart(name,price){


cart.push(name);


total += price;


updateCart();


}



function updateCart(){


let box=document.getElementById("cart");


box.innerHTML="";


cart.forEach(function(item){


box.innerHTML +=

"<p>📦 "+item+"</p>";


});



if(cart.length===0){

box.innerHTML="장바구니가 비어있습니다.";

}



document.getElementById("total").innerHTML=total;



}



function order(){


if(cart.length===0){

alert("주문할 상품이 없습니다.");

return;

}



alert(
"SCHMEETTERLING STORE\n\n주문 완료\n총 금액 : "
+total+
"원"
);



cart=[];

total=0;


updateCart();



}



</script>
