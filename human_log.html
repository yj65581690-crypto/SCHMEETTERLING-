<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#080008;

font-family:"Courier New",monospace;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

}




/* CRT SCAN */

body::before{

content:"";

position:fixed;

inset:0;


background:

repeating-linear-gradient(

0deg,

rgba(255,105,180,.05),

rgba(255,105,180,.05) 1px,

transparent 1px,

transparent 4px

);


pointer-events:none;

z-index:99;

}






.document{


width:850px;


height:1100px;


background:#f5ddeb;


padding:60px;


position:relative;


overflow:hidden;


box-shadow:0 0 50px black;


}





.document::after{


content:"";


position:absolute;


inset:0;



background-image:

radial-gradient(

rgba(150,0,90,.15) 1px,

transparent 1px

);



background-size:10px 10px;


opacity:.2;


pointer-events:none;


}






.internal{


position:absolute;


right:40px;


top:25px;



color:#b0006d;


font-size:14px;


animation:blink 2s infinite;


}




@keyframes blink{


0%,50%{

opacity:1;

}


51%,100%{

opacity:.2;

}


}






.header{


border-bottom:3px solid #222;


padding-bottom:20px;


margin-bottom:30px;


}




.header h1{


font-size:27px;


letter-spacing:3px;


margin:0;


}




.subtitle{


margin-top:10px;


color:#666;


font-size:14px;


}






.section{


border-top:2px solid #333;


padding:18px 0;


}




.label{


font-weight:bold;


font-size:14px;


letter-spacing:1px;


}



.value{


font-size:18px;


line-height:1.7;


margin-top:10px;


}






.handwrite{


font-family:cursive;


font-size:24px;


color:#b0006d;


margin-top:20px;


transform:rotate(-5deg);


}







.stamp{


position:absolute;


right:70px;


bottom:200px;



border:5px solid #b0006d;


color:#b0006d;


padding:18px;



font-size:22px;


font-weight:bold;


transform:rotate(-15deg);


opacity:.8;


}







.navigation{


position:absolute;


bottom:50px;


left:0;


right:0;



display:flex;


justify-content:center;


gap:40px;


font-size:22px;


}




.navigation button{


background:none;


border:2px solid black;


padding:10px 25px;


font-family:inherit;


font-size:22px;


cursor:pointer;


}



.navigation button:hover{


background:black;


color:white;


}






.department{


position:absolute;


bottom:15px;


left:40px;


color:black;


text-decoration:none;


font-size:18px;


}





.loading{


display:none;


position:absolute;


inset:0;


background:rgba(0,0,0,.8);


color:white;


z-index:20;


justify-content:center;


align-items:center;


flex-direction:column;


font-size:25px;


}





.progressBox{


width:320px;


height:25px;


border:2px solid white;


margin-top:20px;


}



.progress{


height:100%;


width:0%;


background:#ff69b4;


}






.error{


display:none;


position:absolute;


inset:0;


background:black;


color:#ff69b4;


z-index:30;


justify-content:center;


align-items:center;


flex-direction:column;


font-size:40px;


}





.glitch{


animation:glitch .15s infinite;


}



@keyframes glitch{


0%{

transform:translate(0);

}


25%{

transform:translate(3px,-2px);

}


50%{

transform:translate(-3px,2px);

}


75%{

transform:translate(2px,1px);

}


100%{

transform:translate(0);

}


}





.damaged{


filter:contrast(1.2) brightness(.8);


}




.warning{


color:#b0006d;

font-weight:bold;

}


</style>

function getLogText(){



if(currentPage<=2){



return `

function changePage(direction){



let next=currentPage+direction;



if(next<1 || next>8){


return;


}





showLoading(function(){



currentPage=next;




if(Math.random()<0.25){



showError(function(){



renderPage();



});



}

else{



renderPage();



}



});



}









function showLoading(callback){



let loading=document.getElementById("loading");


let progress=document.getElementById("progress");



loading.style.display="flex";


progress.style.width="0%";



let width=0;



let timer=setInterval(function(){



width+=20;



progress.style.width=

width+"%";



if(width>=100){



clearInterval(timer);



setTimeout(function(){



loading.style.display="none";


callback();



},200);



}



},80);



}









function showError(callback){



let error=document.getElementById("error");



error.style.display="flex";



setTimeout(function(){



error.style.display="none";


callback();



},600);



}









// RANDOM LOG ERROR



setInterval(function(){



if(currentPage>=6 && Math.random()<0.3){



showError(function(){



renderPage();



});



}



},10000);

renderPage();
