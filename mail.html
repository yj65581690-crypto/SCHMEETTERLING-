<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<title>SCHMEETTERLING STAFF MAIL</title>

<link rel="stylesheet" href="./style.css">

</head>


<body>


<div class="mainBox">


<h2>
✉ STAFF MAIL SYSTEM
</h2>


<p>
MAIL TERMINAL : ONLINE
</p>


<hr>



<h3>
📥 INBOX
</h3>


<div class="recordBox">


<button onclick="openMail(0)">

[ BIO DEPARTMENT ]

<br>

검체 이동 요청

</button>


<br><br>


<button onclick="openMail(1)">

[ DIRECTOR ]

<br>

긴급 업무 지시

</button>


<br><br>


<button onclick="openMail(2)">

[ RADIATION DEPARTMENT ]

<br>

장비 점검 보고

</button>


</div>



<hr>



<div class="recordBox" id="mailView">

메일을 선택하세요.

</div>
 <hr>

<h3>
📤 SEND MAIL
</h3>


<h4>
수신자
</h4>

<select id="mailReceiver">

<option>
DIRECTOR
</option>

<option>
BIO DEPARTMENT
</option>

<option>
RADIATION DEPARTMENT
</option>

<option>
CHEMICAL DEPARTMENT
</option>

<option>
UNKNOWN DEPARTMENT
</option>

<option>
BACKROOM DEPARTMENT
</option>

</select>


<br><br>


<input id="mailTitle" placeholder="메일 제목">


<br><br>


<textarea id="mailText" placeholder="메일 내용"></textarea>


<br><br>


<button onclick="sendMail()">

📨 전송

</button>


<div id="sendLoading">

</div>

<hr>

<h3>
📤 SEND MAIL
</h3>


<input id="mailTitle" placeholder="메일 제목">


<br><br>


<textarea id="mailText" placeholder="메일 내용"></textarea>


<br><br>


<button onclick="sendMail()">

📨 전송

</button>


<div id="sendLoading">

</div>


<br>


<button onclick="location.href='./main.html'">

← CENTRAL TERMINAL

</button>



</div>




<script>


let mails=[


{

from:"BIO DEPARTMENT",

title:"검체 이동 요청",

text:"금일 14시 BIO-014 검체 이동 예정.\n관련 부서 협조 요청."

},


{

from:"DIRECTOR",

title:"긴급 업무 지시",

text:"화학부서 담당자는 즉시 사장실로 이동하세요.\n보안 등급 확인 필요."

},


{

from:"RADIATION DEPARTMENT",

title:"장비 점검 보고",

text:"방사능 부서 장비 정기점검 예정.\n점검 시간 : 22:00"

}


];




function openMail(num){


let mail=mails[num];


document.getElementById("mailView").innerHTML=


`

<h3>
${mail.from}
</h3>


<h4>
${mail.title}
</h4>


<hr>


<p>
${mail.text.replace(/\n/g,"<br>")}
</p>

`;


}
function sendMail(){


let box=document.getElementById("sendLoading");


box.innerHTML=
"📡 TRANSMISSION START<br><br>";


let steps=[

"수신자 확인 중...",
"보안 인증 중...",
"암호화 처리 중...",
"메일 서버 전송 중..."

];


let i=0;


let timer=setInterval(function(){


box.innerHTML +=
"● "+steps[i]+"<br>";


i++;


if(i>=steps.length){


clearInterval(timer);


setTimeout(function(){


box.innerHTML +=
"<br>✔ TRANSMISSION COMPLETE";


},500);


}


},800);


           }


</script>



</body>

</html>
